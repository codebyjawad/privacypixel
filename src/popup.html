<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PrivacyPixel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }
    .tagline {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .stats {
      padding: 20px;
      text-align: center;
    }
    .stat-box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }
    .stat-number {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .tracker-list {
      max-height: 200px;
      overflow-y: auto;
      padding: 0 20px 20px;
    }
    .tracker-item {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .tracker-domain {
      font-weight: bold;
      margin-bottom: 3px;
    }
    .tracker-time {
      opacity: 0.7;
      font-size: 0.75rem;
    }
    .actions {
      padding: 0 20px 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    button:hover {
      background: rgba(255,255,255,0.3);
    }
    .empty {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ PrivacyPixel</h1>
    <p class="tagline">Blocking email trackers</p>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-number" id="blockedCount">0</div>
      <div class="stat-label">Trackers Blocked</div>
    </div>
  </div>

  <div class="tracker-list" id="trackerList">
    <div class="empty">No trackers blocked yet</div>
  </div>

  <div class="actions">
    <button id="clearBtn">Clear Stats</button>
    <button id="settingsBtn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
